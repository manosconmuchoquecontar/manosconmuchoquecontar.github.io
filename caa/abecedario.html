<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abecedario accesible · CAA · Manos con Mucho que Contar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔤</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ── Estilos comunes CAA ── */
/* ═══════════════════════════════════════════════
   CAA · Estilos comunes · Manos con Mucho que Contar
   ═══════════════════════════════════════════════ */

:root {
  --bg: #F5FAFA; --bg2: #E8F4F2; --ink: #1A3A38; --ink2: #4A706D; --ink3: #6E8F8C;
  --teal: #2A9D8F; --teal-d: #1F5249; --border: rgba(26,58,56,0.12); --radius: 20px;
  --foco: #FFB800;
  /* Clave de colores (Fitzgerald modificada) */
  --k-persona: #FFF3B0; --k-accion: #C9F2C7; --k-cosa: #FFD8B0;
  --k-describe: #C7E3FF; --k-social: #FFD1E8; --k-no: #FFC2C2; --k-pregunta: #E3D4FF; --k-lugar: #E8E2D0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, .fredoka { font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 600; }
button { font-family: inherit; cursor: pointer; color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }

/* ── Barra superior ── */
.caa-barra {
  position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: .8rem;
  padding: .6rem 1rem; background: rgba(245,250,250,.96); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.caa-barra .volver {
  display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink2);
  font-weight: 700; font-size: 14px; padding: 8px 12px; border-radius: 100px; background: white; border: 1px solid var(--border);
}
.caa-barra h1 { font-size: 1.15rem; flex: 1; text-align: center; color: var(--teal-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caa-barra .btn-ajustes {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: white;
  font-size: 20px; display: flex; align-items: center; justify-content: center;
}

/* ── Marca de agua ── */
.caa-marca {
  position: fixed; bottom: 8px; right: 12px; z-index: 40; font-size: 11px; font-weight: 700;
  color: var(--ink3); opacity: .75; pointer-events: none;
}

/* ── Botones genéricos ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 22px; border-radius: 100px; border: 1.5px solid var(--border); background: white;
  font-weight: 700; font-size: 15px; transition: transform .15s, background .2s;
}
.btn:active { transform: scale(.96); }
.btn-p { background: var(--teal); color: white; border-color: var(--teal); }
.btn-p:hover { background: #21867A; }
.btn-s { background: var(--bg2); color: var(--teal-d); border-color: transparent; }

/* ── Celda de pictograma ── */
.picto {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 8px; background: white; border: 2.5px solid var(--border); border-radius: 16px;
  font-weight: 800; font-size: clamp(12px, 1.6vw, 16px); line-height: 1.1; text-align: center;
  user-select: none; transition: transform .12s, box-shadow .2s; min-width: 0;
}
.picto:active { transform: scale(.95); }
.picto .img { width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.picto .img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.picto .img .emoji { font-size: clamp(28px, 5vw, 56px); line-height: 1; }
.picto .txt { width: 100%; overflow: hidden; text-overflow: ellipsis; }
.picto.persona { background: var(--k-persona); } .picto.accion { background: var(--k-accion); }
.picto.cosa { background: var(--k-cosa); } .picto.describe { background: var(--k-describe); }
.picto.social { background: var(--k-social); } .picto.no { background: var(--k-no); }
.picto.pregunta { background: var(--k-pregunta); } .picto.lugar { background: var(--k-lugar); }
.picto.vacio { visibility: hidden; }

/* ── Barrido (pulsador) ── */
.caa-foco {
  outline: 6px solid var(--foco) !important; outline-offset: 3px;
  box-shadow: 0 0 0 12px rgba(255,184,0,.28) !important; position: relative; z-index: 5;
}
.caa-foco-fila { outline: 5px dashed var(--foco) !important; outline-offset: 4px; border-radius: 16px; }
body.caa-barrido-activo { cursor: pointer; }

/* ── Alto contraste ── */
body.caa-contraste { --bg: #000; --bg2: #111; --ink: #fff; --ink2: #eee; --ink3: #ccc; --border: #fff; background: #000; }
body.caa-contraste .caa-barra, body.caa-contraste .btn, body.caa-contraste .caa-barra .volver,
body.caa-contraste .caa-barra .btn-ajustes { background: #000; color: #fff; border-color: #fff; }
body.caa-contraste .picto { border-color: #fff; border-width: 3px; color: #000; }
body.caa-contraste .caa-barra h1 { color: #FFE14D; }

/* ── Panel de ajustes ── */
.caa-modal { position: fixed; inset: 0; z-index: 9000; display: none; align-items: center; justify-content: center; background: rgba(26,58,56,.55); backdrop-filter: blur(4px); padding: 1rem; }
.caa-modal.abierto { display: flex; }
.caa-modal .caja { background: white; color: #1A3A38; border-radius: 24px; padding: 1.8rem; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; position: relative; }
.caa-modal h2 { margin-bottom: 1.2rem; color: var(--teal-d); }
.caa-modal .cerrar { position: absolute; top: 1rem; right: 1rem; width: 36px; height: 36px; border-radius: 50%; border: none; background: #E8F4F2; font-size: 16px; }
.ajuste { margin-bottom: 1.3rem; }
.ajuste > label, .ajuste > .lbl { display: block; font-weight: 800; margin-bottom: .5rem; font-size: 14px; }
.ajuste .ayuda { font-size: 13px; color: #4A706D; margin-top: .4rem; line-height: 1.5; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 9px 14px; border-radius: 100px; border: 1.5px solid rgba(26,58,56,.15); background: white; font-weight: 700; font-size: 13px; color: #1A3A38; }
.seg button[aria-pressed="true"] { background: #2A9D8F; color: white; border-color: #2A9D8F; }
.ajuste input[type=range] { width: 100%; accent-color: #2A9D8F; }
.ajuste .fila-check { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; margin-bottom: .4rem; }
.ajuste .fila-check input { width: 20px; height: 20px; accent-color: #2A9D8F; }

/* ── Aviso para adultos ── */
.consejo {
  background: #FFF8E1; border: 1.5px solid #F2D27A; border-radius: 16px; padding: 1rem 1.2rem;
  font-size: 14px; line-height: 1.55; color: #5C4A12;
}
.consejo b { color: #3E3008; }

/* ── Celebración ── */
@keyframes caa-pop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
.pop { animation: caa-pop .45s ease-out both; }

@media print {
  .caa-barra, .caa-marca, .no-print, .caa-modal { display: none !important; }
  body { background: white; }
  .picto { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style>
  html, body { height: 100%; }

  .app { flex: 1; display: flex; flex-direction: column; gap: .55rem; padding: .6rem .8rem 1.6rem; max-width: 1300px; width: 100%; margin: 0 auto; min-height: 0; }

  .opc-wrap summary { cursor: pointer; font-weight: 800; font-size: 13px; color: var(--ink2); padding: 4px 2px; list-style: none; }
  .opc-wrap summary::-webkit-details-marker { display: none; }

  .escrito .cursor { display: inline-block; width: 3px; height: 1.1em; background: var(--teal); margin-left: 2px; animation: parpadeo 1s steps(1) infinite; vertical-align: -0.15em; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  body.caa-contraste .escrito { background: #000; color: #fff; border-color: #fff; }

  .prediccion { display: grid; grid-template-columns: repeat(4, 1fr); gap: .45rem; min-height: 52px; }
  .prediccion button { border-radius: 14px; border: 2px solid #C7E3FF; background: #EEF6FF; font-weight: 800; font-size: clamp(15px, 2.2vw, 22px); padding: 6px; color: #1D4E89; }
  .prediccion button:empty { visibility: hidden; }

  .teclado { flex: 1; display: flex; flex-direction: column; gap: .45rem; min-height: 0; }
  .fila { flex: 1; display: grid; gap: .45rem; min-height: 0; border-radius: 14px; }
  .tecla { border-radius: 14px; border: 2.5px solid var(--border); background: white; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: clamp(20px, 4.5vh, 46px); display: flex; align-items: center; justify-content: center; transition: transform .1s; min-width: 0; padding: 0; }
  .tecla:active { transform: scale(.94); }
  .tecla.vocal.color { background: #FFE9C7; border-color: #F2C27A; }
  .tecla.funcion { font-family: 'Nunito', sans-serif; font-size: clamp(13px, 2.4vh, 20px); font-weight: 800; gap: 6px; background: var(--bg2); }
  .tecla.decir { background: var(--teal); color: white; border-color: var(--teal); }
  .tecla.pulsada { animation: pulso .5s ease-out; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(42,157,143,.6); } 100% { box-shadow: 0 0 0 14px rgba(42,157,143,0); } }
  body.caa-contraste .tecla { background: #000; color: #fff; border-color: #fff; }
  body.caa-contraste .tecla.vocal.color { background: #FFE14D; color: #000; }

  #escritos-modal .caja { max-width: 620px; }
  .lista-escritos { display: flex; flex-direction: column; gap: .5rem; margin: 1rem 0; max-height: 50vh; overflow: auto; }
  .lista-escritos div { background: #F5FAFA; border-radius: 12px; padding: .7rem 1rem; display: flex; gap: .8rem; align-items: center; }
  .lista-escritos .txt { flex: 1; font-family: 'Fredoka', sans-serif; font-size: 1.2rem; word-break: break-word; }
  .lista-escritos small { color: #6E8F8C; font-weight: 700; white-space: nowrap; }
  .lista-escritos button { border: none; background: white; border-radius: 8px; padding: 6px 8px; }
  @media (max-width: 640px) { .tecla.funcion { flex-direction: column; gap: 0; font-size: 11px; } .tecla { border-radius: 8px; border-width: 1.5px; } .fila, .teclado { gap: .25rem; } .prediccion { grid-template-columns: repeat(2, 1fr); } }
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   CAA · Funciones comunes · Manos con Mucho que Contar
   © Creado por Inma Merino Rus

   Qué ofrece a cada juego (objeto global CAA):
   - CAA.init({ titulo, volver, barrido, ajustesExtra })
   - CAA.hablar(texto)            → voz en español (es-ES, 0.85)
   - CAA.celda(item, clase)       → botón con pictograma ARASAAC
       item = { t:'texto', b:'búsqueda opcional', e:'emoji de reserva', id: nº ARASAAC opcional, k:'clave color', d:'lo que dice' }
   - CAA.ponerPicto(contenedor, item)
   - CAA.sonido('exito' | 'pop' | 'campana' | 'suave')
   - CAA.fiesta(x, y, emojis)     → explosión de emojis
   - CAA.scan.reiniciar()         → recalcula elementos tras cambiar la pantalla
   - CAA.ajustes                  → ajustes guardados del usuario

   Barrido: cualquier elemento con clase .scan entra en el barrido.
   Si se agrupan dentro de .scan-fila se hace barrido fila-columna.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  function leer(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ── Ajustes ── */
  var DEF = { acceso: 'tactil', velocidad: 1800, voz: true, vozBarrido: false, contraste: false, sonidos: true };
  var aj = Object.assign({}, DEF, leer('caa-ajustes') || {});
  var oyentes = [];
  function cambiar(k, v) { aj[k] = v; guardar('caa-ajustes', aj); aplicar(); oyentes.forEach(function (f) { f(aj); }); }

  /* ── Voz ── */
  var voz = null;
  function elegirVoz() {
    var vs = speechSynthesis.getVoices();
    voz = vs.find(function (v) { return v.lang === 'es-ES' && /google|mónica|monica|lucia|elvira/i.test(v.name); }) ||
          vs.find(function (v) { return v.lang === 'es-ES'; }) ||
          vs.find(function (v) { return /^es/i.test(v.lang); }) || null;
  }
  if ('speechSynthesis' in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

  function hablar(texto, forzar) {
    if (!texto || (!aj.voz && !forzar) || !('speechSynthesis' in window)) return Promise.resolve();
    return new Promise(function (ok) {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-ES'; u.rate = 0.85; if (voz) u.voice = voz;
      var hecho = false; function fin() { if (!hecho) { hecho = true; ok(); } }
      u.onend = fin; u.onerror = fin;
      setTimeout(function () { speechSynthesis.speak(u); }, 30);
      setTimeout(fin, 1200 + texto.length * 110);
    });
  }

  /* ── Pictogramas ARASAAC ── */
  var cache = leer('caa-pictos') || {};
  var pendientes = {};
  function buscar(tipo, p) {
    return fetch('https://api.arasaac.org/v1/pictograms/es/' + tipo + '/' + encodeURIComponent(p))
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (d) { return Array.isArray(d) && d.length ? d[0]._id : null; });
  }
  function pictoId(p) {
    p = String(p).toLowerCase().trim();
    if (cache[p] != null) return Promise.resolve(cache[p]);
    if (pendientes[p]) return pendientes[p];
    pendientes[p] = buscar('bestsearch', p)
      .then(function (id) { return id != null ? id : buscar('search', p); })
      .then(function (id) { if (id != null) { cache[p] = id; guardar('caa-pictos', cache); } return id; })
      .catch(function () { return null; });
    return pendientes[p];
  }
  function pictoUrl(id) { return 'https://static.arasaac.org/pictograms/' + id + '/' + id + '_300.png'; }

  function ponerPicto(cont, it) {
    if (!cont || it.sinPicto) return;
    var prom = it.id != null ? Promise.resolve(it.id) : pictoId(it.b || it.t);
    prom.then(function (id) {
      if (id == null) return;
      var img = new Image(); img.alt = ''; img.decoding = 'async';
      img.onload = function () { cont.innerHTML = ''; cont.appendChild(img); };
      img.src = pictoUrl(id);
    });
  }

  function celda(it, clase) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'picto scan ' + (it.k || '') + ' ' + (clase || '');
    b.dataset.decir = it.d || it.t;
    b.setAttribute('aria-label', it.t);
    b.innerHTML = '<span class="img"><span class="emoji" aria-hidden="true">' + (it.e || '') + '</span></span>' +
                  '<span class="txt">' + esc(it.t) + '</span>';
    ponerPicto(b.querySelector('.img'), it);
    return b;
  }

  /* ── Sonidos (Web Audio) ── */
  var ac = null;
  function tono(f, t0, dur, tipo, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, ac.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, ac.currentTime + t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + 0.05);
  }
  function sonido(tipo) {
    if (!aj.sonidos) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (tipo === 'exito') { [523, 659, 784, 1047].forEach(function (f, i) { tono(f, i * 0.09, 0.35, 'triangle'); }); }
      else if (tipo === 'pop') { tono(880, 0, 0.12, 'sine', 0.3); tono(1320, 0.04, 0.1, 'sine', 0.15); }
      else if (tipo === 'campana') { tono(1047, 0, 1.2, 'sine', 0.2); tono(1568, 0, 0.8, 'sine', 0.08); }
      else { tono(440, 0, 0.25, 'sine', 0.15); }
    } catch (e) {}
  }

  /* ── Fiesta de emojis ── */
  function fiesta(x, y, emojis, n) {
    emojis = emojis || ['⭐', '✨', '🎉', '💛', '🌟'];
    n = n || 14;
    if (x == null) { x = innerWidth / 2; y = innerHeight / 2; }
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.textContent = emojis[i % emojis.length];
      s.setAttribute('aria-hidden', 'true');
      var ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 160;
      s.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;font-size:' + (24 + Math.random() * 26) +
        'px;pointer-events:none;z-index:8000;transition:transform 1s cubic-bezier(.2,.8,.3,1),opacity 1s;transform:translate(-50%,-50%)';
      document.body.appendChild(s);
      (function (s, dx, dy) {
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          s.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(1.2) rotate(' + (Math.random() * 90 - 45) + 'deg)';
          s.style.opacity = '0';
        }); });
        setTimeout(function () { s.remove(); }, 1100);
      })(s, Math.cos(ang) * dist, Math.sin(ang) * dist);
    }
  }

  /* ═══ Barrido ═══ */
  var scan = { activo: false, i: -1, fila: null, vueltas: 0, timer: null, pausaHasta: 0, propio: false, items: [] };

  function visible(el) {
    if (el.disabled || el.closest('[hidden]') || el.closest('.caa-barra') || el.closest('.caa-modal')) return false;
    if (!(el.offsetWidth || el.offsetHeight || el.getClientRects().length)) return false;
    return getComputedStyle(el).visibility !== 'hidden';
  }
  function raiz() {
    var r = [].filter.call(document.querySelectorAll('[data-scan-raiz]'), function (x) { return !x.hidden && x.offsetParent !== null; });
    return r.length ? r[r.length - 1] : document;
  }
  function unidades() {
    var r = raiz();
    if (scan.fila) {
      if (!r.contains(scan.fila) || !visible(scan.fila)) scan.fila = null;
    }
    if (scan.fila) return [].filter.call(scan.fila.querySelectorAll('.scan'), visible);
    return [].filter.call(r.querySelectorAll('.scan-fila, .scan'), function (el) {
      if (!visible(el)) return false;
      if (el.classList.contains('scan-fila')) return [].some.call(el.querySelectorAll('.scan'), visible);
      return !el.parentElement.closest('.scan-fila');
    });
  }
  function limpiar() {
    document.querySelectorAll('.caa-foco, .caa-foco-fila').forEach(function (e) { e.classList.remove('caa-foco', 'caa-foco-fila'); });
  }
  function marcar() {
    limpiar();
    var el = scan.items[scan.i]; if (!el) return;
    el.classList.add(el.classList.contains('scan-fila') ? 'caa-foco-fila' : 'caa-foco');
    el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    if (aj.vozBarrido && !el.classList.contains('scan-fila')) hablar(el.dataset.decir || el.getAttribute('aria-label') || el.textContent.trim());
  }
  function avanzar() {
    scan.items = unidades();
    if (!scan.items.length) { limpiar(); return; }
    scan.i++;
    if (scan.i >= scan.items.length) {
      scan.i = 0; scan.vueltas++;
      if (scan.fila && scan.vueltas >= 2) {
        var f = scan.fila; scan.fila = null; scan.vueltas = 0;
        scan.items = unidades(); scan.i = Math.max(0, scan.items.indexOf(f));
      }
    }
    marcar();
  }
  function seleccionar() {
    var el = scan.items[scan.i];
    if (!el || !document.contains(el)) { avanzar(); return; }
    if (el.classList.contains('scan-fila')) {
      scan.fila = el; scan.i = -1; scan.vueltas = 0; avanzar(); reloj(); return;
    }
    scan.propio = true; el.click(); scan.propio = false;
    scan.fila = null; scan.vueltas = 0; scan.i = -1;
    scan.pausaHasta = Date.now() + Math.max(1500, aj.velocidad);
    limpiar();
    setTimeout(function () { if (scan.activo && aj.acceso === 'pasos') avanzar(); }, 400);
    reloj();
  }
  function reloj() {
    clearInterval(scan.timer);
    if (!scan.activo || aj.acceso !== 'barrido') return;
    scan.timer = setInterval(function () {
      if (document.hidden || Date.now() < scan.pausaHasta || document.querySelector('.caa-modal.abierto')) return;
      avanzar();
    }, aj.velocidad);
  }
  function exento(t) { return t.closest && (t.closest('.caa-barra') || t.closest('.caa-modal') || t.closest('.no-barrido')); }
  function escribiendo(t) { return t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable); }

  document.addEventListener('keydown', function (e) {
    if (!scan.activo || aj.acceso === 'tactil' || escribiendo(e.target) || document.querySelector('.caa-modal.abierto') || !unidades().length) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      if (e.repeat) return;
      if (aj.acceso === 'barrido') seleccionar();
      else if (e.code === 'Space') avanzar();
      else seleccionar();
    }
  });
  document.addEventListener('pointerdown', function (e) {
    if (!scan.activo || aj.acceso !== 'barrido' || exento(e.target) || !unidades().length) return;
    e.preventDefault(); seleccionar();
  });
  document.addEventListener('click', function (e) {
    if (!scan.activo || aj.acceso !== 'barrido' || scan.propio || exento(e.target) || !unidades().length) return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  var api_scan = {
    reiniciar: function () { scan.fila = null; scan.i = -1; scan.vueltas = 0; limpiar(); if (scan.activo && aj.acceso !== 'tactil') { reloj(); if (aj.acceso === 'pasos') avanzar(); } },
    pausar: function (ms) { scan.pausaHasta = Date.now() + ms; }
  };

  /* ── Aplicar ajustes ── */
  function aplicar() {
    document.body.classList.toggle('caa-contraste', !!aj.contraste);
    document.body.classList.toggle('caa-barrido-activo', scan.activo && aj.acceso === 'barrido');
    if (!scan.activo || aj.acceso === 'tactil') { clearInterval(scan.timer); limpiar(); }
    else api_scan.reiniciar();
  }

  /* ── Panel de ajustes ── */
  function construirAjustes(extra, conBarrido) {
    var m = document.createElement('div');
    m.className = 'caa-modal'; m.id = 'caa-ajustes';
    m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'caa-aj-t');
    m.innerHTML =
      '<div class="caja">' +
      '<button class="cerrar" aria-label="Cerrar ajustes">✕</button>' +
      '<h2 id="caa-aj-t">⚙️ Ajustes</h2>' +
      (conBarrido ?
        '<div class="ajuste"><span class="lbl">Forma de acceso</span><div class="seg" data-k="acceso">' +
          '<button data-v="tactil">👆 Táctil / ratón</button>' +
          '<button data-v="barrido">🔘 Barrido automático (1 pulsador)</button>' +
          '<button data-v="pasos">🔘🔘 Paso a paso (2 pulsadores)</button></div>' +
          '<p class="ayuda" id="caa-ayuda-acceso"></p></div>' +
        '<div class="ajuste" id="caa-aj-vel"><label for="caa-vel">Velocidad del barrido: <span id="caa-vel-v"></span></label>' +
          '<input type="range" id="caa-vel" min="800" max="5000" step="100"></div>' : '') +
      '<div class="ajuste"><span class="lbl">Voz y sonido</span>' +
        '<label class="fila-check"><input type="checkbox" data-c="voz"> Voz (lee en voz alta)</label>' +
        (conBarrido ? '<label class="fila-check"><input type="checkbox" data-c="vozBarrido"> Decir cada opción al recorrerla (barrido auditivo)</label>' : '') +
        '<label class="fila-check"><input type="checkbox" data-c="sonidos"> Efectos de sonido</label></div>' +
      '<div class="ajuste"><span class="lbl">Vista</span>' +
        '<label class="fila-check"><input type="checkbox" data-c="contraste"> Alto contraste (fondo negro)</label></div>' +
      '<div id="caa-aj-extra"></div>' +
      '<button class="btn btn-p" style="width:100%;margin-top:.5rem" data-cerrar>Listo</button>' +
      '</div>';
    document.body.appendChild(m);
    if (typeof extra === 'function') extra(m.querySelector('#caa-aj-extra'));

    var AYUDA = {
      tactil: 'Se toca directamente la opción en la pantalla o se hace clic con el ratón.',
      barrido: 'Las opciones se iluminan una a una. Para elegir: pulsador conectado como ESPACIO o ENTER, o tocar en cualquier parte de la pantalla.',
      pasos: 'ESPACIO pasa a la siguiente opción y ENTER la elige. Ideal con dos pulsadores.'
    };
    function pintar() {
      m.querySelectorAll('.seg[data-k] button').forEach(function (b) { b.setAttribute('aria-pressed', aj[b.parentNode.dataset.k] === b.dataset.v ? 'true' : 'false'); });
      m.querySelectorAll('[data-c]').forEach(function (c) { c.checked = !!aj[c.dataset.c]; });
      var vel = m.querySelector('#caa-vel');
      if (vel) { vel.value = aj.velocidad; m.querySelector('#caa-vel-v').textContent = (aj.velocidad / 1000).toFixed(1) + ' s'; m.querySelector('#caa-aj-vel').hidden = aj.acceso !== 'barrido'; }
      var ay = m.querySelector('#caa-ayuda-acceso'); if (ay) ay.textContent = AYUDA[aj.acceso];
    }
    m.addEventListener('click', function (e) {
      var b = e.target.closest('.seg[data-k] button');
      if (b) { cambiar(b.parentNode.dataset.k, b.dataset.v); pintar(); }
      if (e.target === m || e.target.closest('.cerrar') || e.target.closest('[data-cerrar]')) cerrar();
    });
    m.addEventListener('change', function (e) {
      if (e.target.dataset.c) { cambiar(e.target.dataset.c, e.target.checked); pintar(); }
    });
    m.addEventListener('input', function (e) {
      if (e.target.id === 'caa-vel') { cambiar('velocidad', +e.target.value); pintar(); }
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && m.classList.contains('abierto')) cerrar(); });
    var previo = null;
    function abrir() { previo = document.activeElement; pintar(); m.classList.add('abierto'); m.querySelector('.cerrar').focus(); }
    function cerrar() { m.classList.remove('abierto'); if (previo) previo.focus(); api_scan.reiniciar(); }
    return { abrir: abrir, cerrar: cerrar };
  }

  /* ── Inicio ── */
  function init(o) {
    o = o || {};
    var barra = document.createElement('header');
    barra.className = 'caa-barra';
    barra.innerHTML =
      '<a class="volver" href="' + (o.volver || '../caa.html') + '">← <span>Volver</span></a>' +
      '<h1>' + esc(o.titulo || document.title) + '</h1>' +
      '<button class="btn-ajustes" aria-label="Ajustes de accesibilidad" title="Ajustes">⚙️</button>';
    document.body.insertBefore(barra, document.body.firstChild);

    var marca = document.createElement('div');
    marca.className = 'caa-marca'; marca.textContent = '© Creado por Inma Merino Rus';
    document.body.appendChild(marca);

    scan.activo = o.barrido !== false;
    var panel = construirAjustes(o.ajustesExtra, scan.activo);
    barra.querySelector('.btn-ajustes').addEventListener('click', panel.abrir);
    CAA.abrirAjustes = panel.abrir;
    aplicar();
  }

  window.CAA = {
    init: init, hablar: hablar, celda: celda, ponerPicto: ponerPicto, pictoId: pictoId, pictoUrl: pictoUrl,
    sonido: sonido, fiesta: fiesta, scan: api_scan, esc: esc, leer: leer, guardar: guardar,
    get ajustes() { return aj; },
    alCambiar: function (f) { oyentes.push(f); }
  };
})();

</script>
<script>
CAA.init({ titulo: 'Abecedario accesible' });

var NOMBRES = { a: 'a', b: 'be', c: 'ce', d: 'de', e: 'e', f: 'efe', g: 'ge', h: 'hache', i: 'i', j: 'jota', k: 'ka', l: 'ele', m: 'eme', n: 'ene', 'ñ': 'eñe', o: 'o', p: 'pe', q: 'cu', r: 'erre', s: 'ese', t: 'te', u: 'u', v: 'uve', w: 'uve doble', x: 'equis', y: 'ye', z: 'zeta' };
var DISPOS = {
  abc: ['abcdefg', 'hijklmn', 'ñopqrst', 'uvwxyz'],
  qwerty: ['qwertyuiop', 'asdfghjklñ', 'zxcvbnm']
};
/* Palabras frecuentes para la ayuda de predicción */
var PALABRAS = ('yo tu mama papa agua quiero mas no si ya ayuda me gusta mirar ir dar abrir esto que casa cole perro gato comer beber leche pan galleta ' +
  'jugar pelota coche parque calle bano cama dormir libro cuento musica tele tablet amigo hola adios gracias por favor otra vez ' +
  'bien mal contento triste enfadado miedo cansado hambre sed frio calor grande pequeno arriba abajo dentro fuera aqui alli donde quien cuando ' +
  'abuelo abuela hermano hermana bebe nino nina profe clase fruta manzana platano yogur helado chocolate pizza patatas zumo ' +
  'sol luna lluvia arbol flor playa piscina bici tren avion moto azul rojo verde amarillo blanco negro rosa uno dos tres').split(' ');
var ACENTOS = { mama: 'mamá', papa: 'papá', mas: 'más', si: 'sí', tu: 'tú', que: 'qué', bano: 'baño', pequeno: 'pequeño', tele: 'tele', alli: 'allí', aqui: 'aquí', donde: 'dónde', quien: 'quién', cuando: 'cuándo', platano: 'plátano', arbol: 'árbol', avion: 'avión', bebe: 'bebé', nino: 'niño', nina: 'niña', musica: 'música', frio: 'frío', enfadado: 'enfadado', adios: 'adiós' };
var PRED = PALABRAS.map(function (p) { return ACENTOS[p] || p; }).filter(function (p, i, a) { return a.indexOf(p) === i; });

var est = Object.assign({ orden: 'abc', caso: 'may', eco: 'letra', vocales: 'color', pred: 'si' }, CAA.leer('caa-abc') || {});
var texto = '';
var escritos = CAA.leer('caa-abc-escritos') || [];

function quitarTildes(s) { return s.replace(/ñ/g, '#').normalize('NFD').replace(/[^\x00-\x7F#]/g, '').replace(/#/g, 'ñ'); }
function fmt(s) { return est.caso === 'may' ? s.toUpperCase() : s.toLowerCase(); }

function pintarOpciones() {
  document.querySelectorAll('.opciones .grupo').forEach(function (g) {
    g.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', est[g.dataset.op] === b.dataset.v ? 'true' : 'false'); });
  });
}
document.querySelectorAll('.opciones .grupo').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    est[g.dataset.op] = b.dataset.v; CAA.guardar('caa-abc', est);
    pintarOpciones(); pintarTeclado(); pintarTexto();
  });
});

function tecla(etq, cls, fn, decir) {
  var b = document.createElement('button'); b.type = 'button'; b.className = 'tecla scan ' + (cls || '');
  b.innerHTML = etq; b.dataset.decir = decir || etq;
  b.setAttribute('aria-label', decir || etq);
  b.onclick = function () { b.classList.remove('pulsada'); void b.offsetWidth; b.classList.add('pulsada'); fn(); };
  return b;
}
function pintarTeclado() {
  var t = document.getElementById('teclado'); t.innerHTML = '';
  var filas = DISPOS[est.orden];
  var maxCols = Math.max.apply(null, filas.map(function (f) { return f.length; }));
  filas.forEach(function (f) {
    var fila = document.createElement('div'); fila.className = 'fila scan-fila';
    fila.style.gridTemplateColumns = 'repeat(' + maxCols + ', 1fr)';
    f.split('').forEach(function (l) {
      var vocal = 'aeiou'.indexOf(l) >= 0;
      fila.appendChild(tecla(fmt(l), (vocal ? 'vocal ' : '') + (vocal && est.vocales === 'color' ? 'color' : ''), function () { escribir(l); }, NOMBRES[l]));
    });
    t.appendChild(fila);
  });
  var f = document.createElement('div'); f.className = 'fila scan-fila';
  f.style.gridTemplateColumns = '3fr 1.3fr 1.3fr 1.6fr 1.3fr';
  f.appendChild(tecla('<span>␣</span><span>espacio</span>', 'funcion', function () { escribir(' '); }, 'espacio'));
  f.appendChild(tecla('<span>⌫</span><span>borrar</span>', 'funcion', borrar, 'borrar'));
  f.appendChild(tecla('<span>🗑️</span><span>todo</span>', 'funcion', function () { texto = ''; pintarTexto(); }, 'borrar todo'));
  f.appendChild(tecla('<span>🔊</span><span>leer</span>', 'funcion decir', function () { CAA.hablar(texto.trim() || 'No hay nada escrito', true); }, 'leer'));
  f.appendChild(tecla('<span>💾</span><span>guardar</span>', 'funcion', guardarEscrito, 'guardar'));
  t.appendChild(f);
  CAA.scan.reiniciar();
}

function palabraActual() { var m = texto.match(/(\S*)$/); return m ? m[1] : ''; }
function escribir(l) {
  if (l === ' ') {
    var p = palabraActual();
    texto += ' ';
    if (est.eco !== 'nada' && p) CAA.hablar(p);
  } else {
    texto += l;
    if (est.eco === 'letra') CAA.hablar(NOMBRES[l] || l);
  }
  pintarTexto();
}
function borrar() { texto = texto.slice(0, -1); pintarTexto(); }
function completar(pal) {
  texto = texto.replace(/(\S*)$/, '') + pal + ' ';
  if (est.eco !== 'nada') CAA.hablar(pal);
  pintarTexto();
}

function pintarTexto() {
  var e = document.getElementById('escrito');
  e.innerHTML = CAA.esc(fmt(texto)) + '<span class="cursor" aria-hidden="true"></span>';
  e.scrollLeft = e.scrollWidth;
  pintarPrediccion();
}
function pintarPrediccion() {
  var c = document.getElementById('prediccion'); c.innerHTML = '';
  c.hidden = est.pred !== 'si';
  if (est.pred !== 'si') return;
  var pre = quitarTildes(palabraActual().toLowerCase());
  var ops = pre ? PRED.filter(function (p) { return quitarTildes(p).indexOf(pre) === 0 && quitarTildes(p) !== pre; }).slice(0, 4) : [];
  for (var i = 0; i < 4; i++) {
    var b = document.createElement('button'); b.type = 'button';
    if (ops[i]) {
      b.className = 'scan'; b.textContent = fmt(ops[i]); b.dataset.decir = ops[i];
      b.onclick = (function (w) { return function () { completar(w); }; })(ops[i]);
    }
    c.appendChild(b);
  }
}

/* ── Escritos guardados ── */
function guardarEscrito() {
  var t = texto.trim(); if (!t) return;
  escritos.unshift({ t: t, f: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) });
  escritos = escritos.slice(0, 200);
  CAA.guardar('caa-abc-escritos', escritos);
  CAA.sonido('exito'); CAA.fiesta(null, null, ['💾', '⭐', '✨'], 10);
  CAA.hablar('Guardado');
}
var modal = document.getElementById('escritos-modal');
function pintarEscritos() {
  var l = document.getElementById('lista-escritos');
  if (!escritos.length) { l.innerHTML = '<p style="color:#6E8F8C">Todavía no hay nada guardado.</p>'; return; }
  l.innerHTML = '';
  escritos.forEach(function (x, i) {
    var d = document.createElement('div');
    d.innerHTML = '<span class="txt">' + CAA.esc(fmt(x.t)) + '</span><small>' + CAA.esc(x.f) + '</small>' +
      '<button aria-label="Leer">🔊</button><button aria-label="Borrar">🗑️</button>';
    var bs = d.querySelectorAll('button');
    bs[0].onclick = function () { CAA.hablar(x.t, true); };
    bs[1].onclick = function () { escritos.splice(i, 1); CAA.guardar('caa-abc-escritos', escritos); pintarEscritos(); };
    l.appendChild(d);
  });
}
document.getElementById('ver-escritos').onclick = function () { pintarEscritos(); modal.classList.add('abierto'); modal.querySelector('.cerrar').focus(); };
modal.addEventListener('click', function (e) { if (e.target === modal || e.target.closest('.cerrar') || e.target.closest('[data-cerrar]')) modal.classList.remove('abierto'); });

/* Teclado físico (solo en modo táctil, para adultos o niños que usan teclado) */
document.addEventListener('keydown', function (e) {
  if (CAA.ajustes.acceso !== 'tactil' || document.querySelector('.caa-modal.abierto') || e.ctrlKey || e.metaKey) return;
  var k = e.key.toLowerCase();
  if (NOMBRES[k]) { e.preventDefault(); escribir(k); }
  else if (e.key === 'Backspace') { e.preventDefault(); borrar(); }
  else if (e.key === ' ') { e.preventDefault(); escribir(' '); }
  else if (e.key === 'Enter') { e.preventDefault(); CAA.hablar(texto.trim(), true); }
});

if (window.matchMedia('(min-width: 900px)').matches) document.getElementById('opc-wrap').open = true;
pintarOpciones(); pintarTeclado(); pintarTexto();
</script>
